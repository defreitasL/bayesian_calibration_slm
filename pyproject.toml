[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slmcal"
version = "1.0.0"
description = "Bayesian calibration + NSGA-II pre-calibration workflow for shoreline evolution models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Lucas de Freitas Pereira", email = "freitasl@unican.es"}
]
keywords = ["shoreline", "bayesian", "calibration", "nsga-ii", "coastal", "uncertainty"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "pandas>=2.0",
  "xarray>=2023.1.0",
  "netCDF4>=1.6",
]

[project.urls]
Homepage = "https://github.com/defreitasL/bayesian_calibration_slm"
Repository = "https://github.com/defreitasL/bayesian_calibration_slm"

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "seaborn>=0.13", "scikit-learn>=1.3"]
bayes = ["pymc>=5", "arviz>=0.16", "pytensor>=2", "scipy>=1.10"]
numba = ["numba>=0.58"]
fastopt = [
  "numba>=0.58",
  "fast_optimization @ git+https://github.com/defreitasL/fast_optimization",
]
dev = [
  "pytest>=7",
  "ruff>=0.1.0",
  "mypy>=1.5",
]
io = ["netCDF4>=1.6"]
# Signal-decomposition experts (pySPADS). Not needed for the published results.
spads = ["PyEMD", "scikit-learn>=1.3", "pandas>=2.0"]
# Mixture-of-experts time-series experts.
moe = ["statsmodels>=0.14", "scikit-learn>=1.3"]

# Exact versions used to produce the published results.
paper = [
  "numpy==1.26.4",
  "scipy==1.15.1",
  "pandas==2.2.3",
  "xarray==2024.3.0",
  "netCDF4==1.6.5",
  "matplotlib==3.8.4",
  "seaborn>=0.13",
  "scikit-learn==1.5.0",
  "numba==0.59.1",
  "pymc==5.26.1",
  "arviz==0.22.0",
  "fast_optimization @ git+https://github.com/defreitasL/fast_optimization",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
